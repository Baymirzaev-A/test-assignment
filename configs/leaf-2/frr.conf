frr version 10.2.1
frr defaults traditional
hostname leaf-2
log syslog informational
service integrated-vtysh-config
!
router bgp 65112
 bgp router-id 10.0.1.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy

 neighbor 192.168.1.2 remote-as 65001
 neighbor 192.168.2.2 remote-as 65001
 !
 address-family ipv4 unicast
  maximum-paths 2
  network 10.0.1.2/32
  network 10.10.10.2/32
  neighbor 192.168.1.2 activate
  neighbor 192.168.2.2 activate
 exit-address-family
!
router bgp 64999
bgp router-id 10.10.10.2
! Группа для Spine-ов
neighbor SPINES peer-group
neighbor SPINES remote-as 64999
neighbor 10.10.255.1 peer-group SPINES
neighbor 10.10.255.2 peer-group SPINES
!
address-family l2vpn evpn
neighbor SPINES activate
! Пока не добавляем advertise-all-vni, так как VXLAN еще нет
exit-address-family
!
line vty
!