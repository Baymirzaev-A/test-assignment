frr version 10.2.1
frr defaults traditional
hostname leaf-1
log syslog informational
service integrated-vtysh-config
!
router bgp 64999
 bgp router-id 10.0.1.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy

 neighbor 192.168.1.0 remote-as 65001
 neighbor 192.168.1.0 local-as 65111 no-prepend replace-as

 neighbor 192.168.2.0 remote-as 65001
 neighbor 192.168.2.0 local-as 65111 no-prepend replace-as
 !
 neighbor SPINE peer-group
 neighbor SPINE remote-as 64999
 neighbor SPINE update-source 10.10.10.1
 !
 neighbor 10.10.255.1 peer-group SPINE
 neighbor 10.10.255.2 peer-group SPINE
 !
 address-family ipv4 unicast
  maximum-paths 2
  network 10.0.1.1/32
  network 10.10.10.1/32
  neighbor 192.168.1.0 activate
  neighbor 192.168.2.0 activate
 exit-address-family
!
address-family l2vpn evpn
 neighbor SPINE activate
 advertise-all-vni
exit-address-family
!
line vty
!