frr version 10.2.1
frr defaults traditional
hostname spine-1
log syslog informational
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy

 neighbor 192.168.255.0 remote-as 65000
 neighbor 192.168.1.1 remote-as 65111
 neighbor 192.168.1.3 remote-as 65112
 neighbor 192.168.1.5 remote-as 65113
 neighbor 192.168.1.7 remote-as 65114
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  network 10.10.255.1/32
  neighbor 192.168.255.0 activate
  neighbor 192.168.1.1 activate
  neighbor 192.168.1.3 activate
  neighbor 192.168.1.5 activate
  neighbor 192.168.1.7 activate
 exit-address-family
!
router bgp 64999
 bgp router-id 10.10.255.1
 neighbor Leaf-clients peer-group
 neighbor Leaf-clients remote-as 64999

 neighbor 10.10.10.1 peer-group Leaf-clients
 neighbor 10.10.10.2 peer-group Leaf-clients
 neighbor 10.10.10.3 peer-group Leaf-clients
 neighbor 10.10.10.4 peer-group Leaf-clients
 neighbor 10.10.10.100 peer-group Leaf-clients
 !
 address-family l2vpn evpn
  neighbor Leaf-clients activate
  neighbor Leaf-clients route-reflector-client
 exit address-family
!
line vty
!