frr version 10.2.1
frr defaults traditional
hostname leaf-3
log syslog informational
service integrated-vtysh-config
!
router bgp 64999
 bgp router-id 10.0.1.3
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy

 neighbor 192.168.1.4 remote-as 65001
 neighbor 192.168.1.4 local-as 65113 no-prepend replace-as

 neighbor 192.168.2.4 remote-as 65001
 neighbor 192.168.2.4 local-as 65113 no-prepend replace-as
 !
 neighbor SPINE peer-group
 neighbor SPINE remote-as 64999
 !
 neighbor 10.10.255.1 peer-group SPINE
 neighbor 10.10.255.2 peer-group SPINE
!
 address-family ipv4 unicast
  maximum-paths 2
  network 10.0.1.3/32
  network 10.10.10.3/32
  neighbor 192.168.1.4 activate
  neighbor 192.168.2.4 activate
 exit-address-family
!
 address-family l2vpn evpn
  neighbor SPINE activate
  advertise-all-vni
  !
  vni 10010
   rd 10.10.10.3:11
  exit-vni
  vni 10020
   rd 10.10.10.3:12
  exit-vni
  vni 20010
   rd 10.10.10.3:21
  exit-vni
  vni 20020
   rd 10.10.10.3:22 
  exit-vni
 exit-address-family
!
line vty
!