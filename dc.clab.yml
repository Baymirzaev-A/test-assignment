name: dc-fabric

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    gateway:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/gateway/frr.conf
      daemons: [zebra, bgpd]
      binds:
        - configs/gateway/setup.sh:/setup.sh
      exec:
        - bash /setup.sh
      mgmt-ipv4: 172.20.20.100

    spine-1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/spine-1/frr.conf
      daemons: [zebra, bgpd]
      binds:
        - configs/spine-1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh
      mgmt-ipv4: 172.20.20.11

    spine-2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/spine-2/frr.conf
      daemons: [zebra, bgpd]
      binds:
        - configs/spine-2/setup.sh:/setup.sh
      exec:
        - bash /setup.sh
      mgmt-ipv4: 172.20.20.12

    leaf-1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/leaf-1/frr.conf
      daemons: [zebra, bgpd]
      binds:
      - configs/leaf-1/setup.sh:/setup.sh
      - configs/mlag/mlag-setup.sh:/mlag-setup.sh
      exec:
      - bash /setup.sh
      - bash /mlag-setup.sh leaf-1
      mgmt-ipv4: 172.20.20.21

    leaf-2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/leaf-2/frr.conf
      daemons: [zebra, bgpd]
      binds:
      - configs/leaf-2/setup.sh:/setup.sh
      - configs/mlag/mlag-setup.sh:/mlag-setup.sh
      exec:
      - bash /setup.sh
      - bash /mlag-setup.sh leaf-2
      mgmt-ipv4: 172.20.20.22

    leaf-3:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/leaf-3/frr.conf
      daemons: [zebra, bgpd]
      binds:
      - configs/leaf-3/setup.sh:/setup.sh
      - configs/mlag/mlag-setup.sh:/mlag-setup.sh
      exec:
      - bash /setup.sh
      - bash /mlag-setup.sh leaf-3
      mgmt-ipv4: 172.20.20.23

    leaf-4:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/leaf-4/frr.conf
      daemons: [zebra, bgpd]
      binds:
      - configs/leaf-4/setup.sh:/setup.sh
      - configs/mlag/mlag-setup.sh:/mlag-setup.sh
      exec:
      - bash /setup.sh
      - bash /mlag-setup.sh leaf-4
      mgmt-ipv4: 172.20.20.24
    
    srv-mh-01:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/srv-mh-01.sh:/setup-mh.sh
      exec:
        - sh /setup-mh.sh

    srv-mh-02:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/srv-mh-02.sh:/setup-mh.sh
      exec:
        - sh /setup-mh.sh

    srv-mlag-01:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/setup.sh:/setup.sh
      exec:
        - sh /setup.sh

    srv-mlag-02:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/setup.sh:/setup.sh
      exec:
        - sh /setup.sh

    srv-mlag-03:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/setup.sh:/setup.sh
      exec:
        - sh /setup.sh

    srv-mlag-04:
      kind: linux
      image: alpine:latest
      binds: 
        - configs/servers/setup.sh:/setup.sh
      exec:
        - sh /setup.sh
      

  links:
    # Gateway <-> Spine
    - endpoints: ["gateway:eth1", "spine-1:eth1"]
    - endpoints: ["gateway:eth2", "spine-2:eth1"]

    # Spine-1 <-> Leaf-1..4
    - endpoints: ["spine-1:eth2", "leaf-1:eth1"]
    - endpoints: ["spine-1:eth3", "leaf-2:eth1"]
    - endpoints: ["spine-1:eth4", "leaf-3:eth1"]
    - endpoints: ["spine-1:eth5", "leaf-4:eth1"]

    # Spine-2 <-> Leaf-1..4
    - endpoints: ["spine-2:eth2", "leaf-1:eth2"]
    - endpoints: ["spine-2:eth3", "leaf-2:eth2"]
    - endpoints: ["spine-2:eth4", "leaf-3:eth2"]
    - endpoints: ["spine-2:eth5", "leaf-4:eth2"]

    # MLAG peer-links (L2, no IP)
    - endpoints: ["leaf-1:eth3", "leaf-2:eth3"]
    - endpoints: ["leaf-3:eth3", "leaf-4:eth3"]

    # EVPN Multihoming
    - endpoints: ["leaf-1:eth4", "srv-mh-01:eth1"]
    - endpoints: ["leaf-2:eth4", "srv-mh-01:eth2"]

    - endpoints: ["leaf-3:eth4", "srv-mh-02:eth1"]
    - endpoints: ["leaf-4:eth4", "srv-mh-02:eth2"]

    # MLAG: Leaf-1 / Leaf-2
    - endpoints: ["leaf-1:eth5", "srv-mlag-01:eth1"]
    - endpoints: ["leaf-2:eth5", "srv-mlag-01:eth2"]

    - endpoints: ["leaf-1:eth6", "srv-mlag-02:eth1"]
    - endpoints: ["leaf-2:eth6", "srv-mlag-02:eth2"]

    # MLAG: Leaf-3 / Leaf-4
    - endpoints: ["leaf-3:eth5", "srv-mlag-03:eth1"]
    - endpoints: ["leaf-4:eth5", "srv-mlag-03:eth2"]

    - endpoints: ["leaf-3:eth6", "srv-mlag-04:eth1"]
    - endpoints: ["leaf-4:eth6", "srv-mlag-04:eth2"]